<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grandma's House — Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#17111c;color:#f4ddac;font-family:monospace;display:flex;align-items:center;justify-content:center;min-height:100dvh;flex-direction:column;padding:18px}h1{font-size:clamp(19px,4vw,30px);margin:0 0 10px;letter-spacing:2px}p{font-size:12px;text-align:center;line-height:1.5;margin:8px 0}canvas{image-rendering:pixelated;image-rendering:crisp-edges;max-width:960px;width:100%;height:auto;aspect-ratio:16/9;border:5px solid #6d4331;box-shadow:0 16px 0 #0d0a12;background:#000;touch-action:none}.controls{display:flex;gap:12px;margin-top:20px;align-items:center;justify-content:space-between;width:min(960px,100%)}button{font-family:monospace;border:2px solid #f4ddac;border-radius:4px;background:#382b39;color:#fff1cc;font-weight:bold;cursor:pointer;min-height:45px;min-width:62px;touch-action:none}button:active{background:#8b5742}.pad{display:flex;gap:6px}.actions{display:flex;gap:6px}footer{opacity:.7;font-size:11px;margin-top:18px;text-align:center}</style></head><body><h1>GRANDMA'S HOUSE</h1><canvas id="game" width="320" height="180" aria-label="Playable pixel art Grandma's House game"></canvas><p>MOVE: ← → / A D &nbsp; • &nbsp; INTERACT: Z / ENTER &nbsp; • &nbsp; BACK: X / ESC<br>Walk to the TV, then the cartridge shelf. You can also use the buttons below.</p><div class="controls"><div class="pad"><button id="left">◀</button><button id="right">▶</button></div><div class="actions"><button id="back">BACK</button><button id="act">A / SELECT</button></div></div><footer>Playable proof of concept • Original pixel art drawn in-browser • Progress saved locally</footer><script>
(()=>{'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const W=320,H=180;let mode='house',px=140,vy=0,skateX=160,skateY=115,score=0,best=+localStorage.getItem('gh_best')||0,timer=45*60,cartridge='',menuIndex=0,message='',msgT=0,flash=0,skateAir=0;let keys={};const C={black:'#17111c',dark:'#39212c',cream:'#f9daa5',wood:'#90502e',walnut:'#63351e',lightwood:'#b8753a',wall:'#e6ae77',sun:'#f9b255',rug:'#8e3d40',green:'#517849',leaf:'#28573e',blue:'#4f8cb9',sky:'#dc7750',white:'#fff1d6',gray:'#605d63'};function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x|0,y|0,w|0,h|0)}function txt(t,x,y,col=C.white,sz=8){g.fillStyle=col;g.font=`bold ${sz}px monospace`;g.fillText(t,x|0,y|0)}function center(t,y,col=C.white,sz=8){g.font=`bold ${sz}px monospace`;txt(t,(W-g.measureText(t).width)/2,y,col,sz)}function win(){rect(8,17,78,66,C.walnut);rect(12,21,70,57,C.sky);rect(13,59,68,19,'#d96c45');rect(12,62,70,15,C.sun);rect(44,21,5,57,C.walnut);rect(12,47,70,4,C.walnut);rect(10,19,10,63,'#f5c894');rect(73,19,10,63,'#f5c894');for(let k=0;k<5;k++){rect(14,24+k*10,3,3,C.rug);rect(77,27+k*9,3,3,C.rug)}}function sofa(){rect(20,91,103,34,C.walnut);rect(24,87,95,32,'#e4c389');rect(29,95,84,22,'#e9ca93');rect(16,98,14,30,'#d6ae7d');rect(113,98,14,30,'#d6ae7d');for(let i=0;i<9;i++){let x=31+i*9;rect(x,97,3,3,C.rug);rect(x+2,99,3,2,C.leaf);rect(x+1,111,3,3,C.rug);rect(x+4,113,3,2,C.leaf)}rect(18,124,107,4,C.walnut)}function tv(){rect(190,71,64,64,C.walnut);rect(194,76,57,42,C.dark);rect(198,80,41,31,cartridge?'#426b9e':'#243f61');rect(241,80,6,31,C.gray);rect(200,83,37,23,cartridge?'#527fbb':'#293956');if(cartridge){rect(200,100,37,7,C.green);rect(208,91,5,9,C.leaf);rect(211,86,2,8,C.leaf);rect(223,91,5,9,C.leaf)}else{for(let i=0;i<16;i++)rect(201+(i*11)%35,85+(i*7)%21,2,1,i%2?C.cream:C.blue)}rect(191,120,61,14,C.walnut);rect(195,121,53,3,C.lightwood);rect(213,127,19,4,C.gray);rect(211,70,24,3,C.gray)}function shelf(){rect(259,63,45,73,C.walnut);rect(263,68,36,61,'#352329');for(let row=0;row<4;row++){for(let col=0;col<8;col++)rect(266+col*4,72+row*14,3,10,[C.cream,C.rug,C.green,C.blue,'#b58347'][((col+row*3)%5)]);rect(262,81+row*14,39,3,C.lightwood)}}function player(x,y){rect(x-5,y-21,12,10,C.walnut);rect(x-3,y-20,11,8,C.cream);rect(x+5,y-16,3,2,C.black);rect(x-5,y-10,13,12,C.rug);rect(x-5,y+2,5,7,C.blue);rect(x+3,y+2,5,7,C.blue);rect(x-6,y+8,7,3,C.white);rect(x+2,y+8,7,3,C.white)}function room(){rect(0,0,W,135,C.wall);rect(0,0,W,11,C.walnut);rect(0,87,W,47,'#a4774c');rect(0,87,W,5,C.walnut);for(let i=0;i<16;i++)rect(i*21,92,2,42,C.walnut);rect(0,135,W,45,C.lightwood);for(let i=0;i<16;i++)rect(i*22,136,2,44,C.walnut);rect(0,154,W,2,C.walnut);win();rect(120,24,37,27,C.walnut);rect(124,28,29,19,'#c1875d');rect(129,32,5,6,C.cream);rect(141,32,5,6,C.cream);rect(129,42,18,2,C.rug);rect(0,159,W,21,C.walnut);rect(64,137,191,29,C.rug);rect(69,142,181,18,'#9d5b48');for(let i=0;i<22;i++)rect(74+i*8,148+(i%2)*5,3,3,C.cream);sofa();rect(135,96,18,27,C.walnut);rect(138,83,12,14,C.cream);rect(141,79,7,5,C.cream);tv();shelf();rect(307,75,13,59,C.walnut);rect(310,79,10,48,'#221b26');player(px,141);txt('SATURDAY  5:42 PM',8,10,C.white,8);if(cartridge)txt('CART: '+cartridge,8,177,C.cream,7);else txt('NO CARTRIDGE',8,177,C.cream,7);const near=Math.abs(px-223)<25?'TV':Math.abs(px-282)<23?'SHELF':Math.abs(px-70)<30?'COUCH':Math.abs(px-312)<15?'DOOR':'';if(near){rect(108,114,104,16,C.black);rect(109,115,102,14,C.cream);rect(110,116,100,12,C.black);center('Z: '+near,125,C.white,9)}if(message&&msgT>0){panel(26,18,268,44);center(message,45,C.white,8)}}function panel(x,y,w,h){rect(x,y,w,h,C.white);rect(x+2,y+2,w-4,h-4,C.black);rect(x+4,y+4,w-8,h-8,'#29212f')}function shelfMenu(){room();panel(52,22,216,127);center('SELECT A CARTRIDGE',40,C.cream,10);['COASTLINE 89','DIRT RACER   [LOCKED]','POND HOCKEY  [LOCKED]','FIELD DAY    [LOCKED]'].forEach((name,i)=>{txt((menuIndex===i?'▶ ':'  ')+name,65,64+i*19,i===0?C.white:C.gray,9)});center('UP/DOWN TO CHOOSE  Z TO PICK',136,C.cream,7)}function dialogue(){room();panel(30,55,260,66);center(message,79,C.white,9);center('Z: OK',105,C.cream,9)}function play(){rect(0,0,W,H,'#5b9ad0');rect(0,0,W,17,C.black);txt('COASTLINE 89',8,11,C.white,8);txt('SCORE '+score,124,11,C.white,8);txt('TIME '+Math.ceil(timer/60),250,11,C.white,8);rect(0,114,W,66,'#e6b66c');rect(0,94,75,86,'#ad6536');rect(244,94,76,86,'#ad6536');rect(75,140,169,40,'#bb743a');for(let i=0;i<26;i++){rect(i*12,172,5,2,C.rug)}rect(74,137,171,4,C.dark);rect(0,91,75,4,C.dark);rect(245,91,75,4,C.dark);rect(96,25,127,16,'#74b9dd');txt('Z / UP = JUMP    ← → MOVE',71,34,C.black,8);let yy=skateY-(skateAir>0?Math.sin(skateAir/27*Math.PI)*45:0);rect(skateX-8,yy+10,17,3,C.dark);rect(skateX-6,yy+11,3,2,C.cream);rect(skateX+5,yy+11,3,2,C.cream);player(skateX,yy);if(timer<=0){panel(64,55,192,65);center('RUN COMPLETE!',76,C.cream,11);center('SCORE: '+score,93);center('Z: BACK TO HOUSE',109,C.white,8)}}function interact(){if(mode==='dialogue'){mode='house';message='';return}if(mode==='shelf'){if(menuIndex===0){cartridge='COASTLINE 89';mode='dialogue';message='GAME SELECTED! RETURN TO TV.'}else {message='COMING SOON!';mode='shelf';msgT=65}return}if(mode==='play'){if(timer<=0){mode='house';px=217;message='GOOD GAME!';msgT=110} else if(skateAir===0){skateAir=1;score+=50}return}if(mode==='confirm'){mode='play';score=0;timer=45*60;skateX=160;skateAir=0;return}if(mode!=='house')return;if(Math.abs(px-223)<25){if(cartridge){mode='confirm';message='PLAY '+cartridge+'?'}else{mode='dialogue';message='NO GAME! CHECK THE BOOKSHELF.'}}else if(Math.abs(px-282)<23){mode='shelf';menuIndex=0}else if(Math.abs(px-70)<30){mode='dialogue';message='GRANDMA LOVES THIS COUCH.'}else if(Math.abs(px-312)<15){mode='dialogue';message='MORE ROOMS COMING SOON!'}}function back(){if(mode==='play'){mode='house';px=218}else if(mode==='confirm'||mode==='dialogue'||mode==='shelf'){mode='house';message=''}}function down(k){if(keys[k])return;keys[k]=true;if(k==='z'||k==='enter'||k===' '){interact();return}if(k==='x'||k==='escape'){back();return}if(mode==='shelf'){if(k==='arrowdown'||k==='s')menuIndex=(menuIndex+1)%4;if(k==='arrowup'||k==='w')menuIndex=(menuIndex+3)%4}else if(mode==='confirm'&&(k==='arrowleft'||k==='arrowright'))back()}function frame(){flash++;if(mode==='house'){if(keys.arrowleft||keys.a)px=Math.max(10,px-1.45);if(keys.arrowright||keys.d)px=Math.min(313,px+1.45)}if(mode==='play'&&timer>0){timer--;if(keys.arrowleft||keys.a)skateX=Math.max(79,skateX-2);if(keys.arrowright||keys.d)skateX=Math.min(241,skateX+2);if(skateAir>0){skateAir++;if(skateAir>=27){skateAir=0;score+=100;best=Math.max(best,score);localStorage.setItem('gh_best',best)}}}if(msgT>0)msgT--;g.clearRect(0,0,W,H);if(mode==='play')play();else if(mode==='shelf')shelfMenu();else if(mode==='dialogue')dialogue();else if(mode==='confirm'){room();panel(39,53,242,74);center('PLAY '+cartridge+'?',71,C.white,9);center('Z = START',92,C.cream,9);center('X = CANCEL',111,C.cream,9)}else room();requestAnimationFrame(frame)}window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown',' ','enter','escape'].includes(k))e.preventDefault();down(k)});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function bind(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();down(key)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,e=>{keys[key]=false}))}bind('left','arrowleft');bind('right','arrowright');bind('act','z');bind('back','x');frame()})();
</script></body></html>
